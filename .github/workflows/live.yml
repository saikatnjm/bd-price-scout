# Manually triggered live check of store adapters against the real stores.
# Never runs automatically, so normal CI makes no requests to stores.
name: Live store check

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      LIVE_STORE_TESTS: "1"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Live check
        shell: bash {0}
        run: |
          npx vitest run src/server/stores/othoba/othoba.live.test.ts --reporter=verbose > out.txt 2>&1; code=$?
          echo "::notice title=live::$(sed 's/\x1b\[[0-9;]*m//g' out.txt | grep -E 'LIVE|Tests |FAIL|Error' | cut -c1-600 | awk 'BEGIN{ORS="%0A"} {print}')"
          tail -n 20 out.txt; exit $code
