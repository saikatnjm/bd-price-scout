# Manually triggered: regenerates package-lock.json from package.json and commits it.
# Used because dependencies are resolved in CI rather than on a developer machine.
name: Update lockfile

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  lockfile:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
      - name: Report latest versions of direct dependencies
        run: |
          msg=$(node -e 'const p=require("./package.json");console.log(Object.keys({...p.dependencies,...p.devDependencies}).join(" "))' \
            | tr ' ' '\n' | while read -r d; do echo "$d $(npm view "$d" version) peer=$(npm view "$d" peerDependencies --json 2>/dev/null | tr -d '\n ' | cut -c1-200)"; done)
          echo "::notice title=Latest versions::$(echo "$msg" | awk 'BEGIN{ORS="%0A"} {print}')"
      - run: >-
          .github/scripts/run.sh bash -c 'npm install --no-audit --no-fund ||
          { tail -n 45 ~/.npm/_logs/*-debug-0.log | cut -c1-220; exit 1; }'
      - name: Commit lockfile if changed
        run: |
          if git diff --quiet --exit-code -- package-lock.json && git ls-files --error-unmatch package-lock.json >/dev/null 2>&1; then
            echo "Lockfile unchanged."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "chore: update package-lock.json"
          git push
