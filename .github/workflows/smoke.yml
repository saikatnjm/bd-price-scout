# Manually triggered HTTP smoke test against a deployed URL (e.g. the Vercel production URL).
name: Deployment smoke test

on:
  workflow_dispatch:
    inputs:
      url:
        description: Base URL to test, e.g. https://bd-price-scout.vercel.app
        required: true

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      # Pass the input via env: interpolating it into the script would allow shell injection.
      - env:
          BASE_URL: ${{ inputs.url }}
          SMOKE_LIVE_SEARCH: "1"
          SMOKE_EXPECT_CSP: "1"
        run: .github/scripts/run.sh .github/scripts/smoke.sh "$BASE_URL" "$GITHUB_SHA"
