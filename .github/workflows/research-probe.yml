# TEMPORARY research helper. Not part of the app; branch to be deleted.
name: Research probe
on: push
permissions:
  contents: read
jobs:
  live:
    if: "!contains(github.event.head_commit.message, '[skip probe]')"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      LIVE_STORE_TESTS: "1"
    steps:
      - uses: actions/checkout@v5
        with:
          ref: dev
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Live check (compact fields)
        shell: bash {0}
        run: |
          npx vitest run src/server/stores/othoba/othoba.live.test.ts --reporter=verbose > out.txt 2>&1; code=$?
          msg=$(grep -E '"(title|price|regularPrice|availability|url|seller|brand|sku|storeProductId)"' out.txt | sed 's/^ *//' | tr -d '\r' | awk 'BEGIN{ORS="%0A"} {print}')
          echo "::notice title=live-fields::$msg"
          tail -n 5 out.txt; exit $code
