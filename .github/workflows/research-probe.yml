# TEMPORARY research helper. Not part of the app; branch to be deleted.
name: Research probe
on: push
permissions:
  contents: read
jobs:
  images:
    if: "!contains(github.event.head_commit.message, '[skip probe]')"
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Image responses by Referer (3 requests per image, 2s apart)
        shell: bash {0}
        run: |
          out=""
          for img in https://images.othoba.com/images/thumbs/0951806_starship-soyabean-oil-5ltr.jpeg https://images.othoba.com/images/thumbs/1582373_fresh-fortified-soyebean-oil-5ltr.webp; do
            for ref in "" "https://othoba.com/" "https://bd-price-scout.vercel.app/"; do
              args=(-sS -o /dev/null -D h.txt -w '%{http_code} %{content_type} %{size_download}B')
              [ -n "$ref" ] && args+=(-e "$ref")
              r=$(curl "${args[@]}" "$img"); srv=$(grep -iE '^(server|x-cache|cf-cache-status):' h.txt | tr -d '\r' | tr '\n' ' ')
              line="${img##*/} referer=[${ref:-none}] -> $r | $srv"; echo "$line"; out="$out$line%0A"; sleep 2
            done
          done
          echo "::notice title=probe::$out"
