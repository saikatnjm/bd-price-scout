# TEMPORARY research probe (Phase 3). Not part of the app; branch to be deleted.
name: Research probe
on: push
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Plain server-side requests to Othoba (robots + category + 2 product pages, 3s apart)
        shell: bash {0}
        run: |
          ua="BDPriceScout-research/0.1 (+https://github.com/saikatnjm/bd-price-scout)"
          out=""
          for u in https://othoba.com/fresh-fortified-soyebean-oil-5ltr-meghna-group-of-industries-709817 https://othoba.com/mr-noodles-12-pcs-family-pack-masala-62gm-x-12pcs-33408; do
            curl -sS -A "$ua" -H 'Accept: text/html' -D h.txt -o b.html -w '%{http_code} %{size_download}B %{time_total}s redirects=%{num_redirects}' "$u" > m.txt || true
            hdr=$(grep -iE '^(server|cf-ray|cf-mitigated|x-cache|cache-control|content-type|retry-after|x-ratelimit[^:]*):' h.txt | tr -d '\r' | tr '\n' ';')
            cookies=$(grep -i '^set-cookie:' h.txt | sed -E 's/^set-cookie: *([^=]+)=.*/\1/I' | tr -d '\r' | tr '\n' ',')
            checks="ldProduct=$({ grep -cE '"@type" *: *"Product"' b.html || true; }) $(grep -oE '"(price|sale_price|availability|sku|brand|seller)" *: *"[^"]*"' b.html | head -8 | tr '\n' ' ')"
            line="$u -> $(cat m.txt) | $hdr cookies=$cookies | $checks"
            echo "$line"; out="$out$line%0A"
            sleep 3
          done
          echo "::notice title=probe::$out"
