# TEMPORARY research helper. Not part of the app; branch to be deleted.
name: Research probe
on: push
permissions:
  contents: read
jobs:
  live:
    if: "!contains(github.event.head_commit.message, '[skip probe]')"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      LIVE_STORE_TESTS: "1"
    steps:
      - uses: actions/checkout@v5
        with:
          ref: dev
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: .github/scripts/run.sh npx vitest run src/server/stores/othoba/othoba.live.test.ts --reporter=verbose
