# Local development: everything runs in the container; nothing is installed on the host.
#   docker compose up --build                # dev server on http://localhost:3000
#   docker compose run --rm app npm run check  # lint + typecheck + tests + build
services:
  app:
    build: .
    ports:
      # Loopback only: the dev server is not exposed to the local network.
      - "127.0.0.1:3000:3000"
    environment:
      NEXT_TELEMETRY_DISABLED: "1"
    env_file:
      - path: .env.local
        required: false
    volumes:
      - .:/app
      # Keep dependencies and build output inside Docker volumes, not on the host.
      - node_modules:/app/node_modules
      - next_build:/app/.next

volumes:
  node_modules:
  next_build:
